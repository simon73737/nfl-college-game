<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut" />
  <title>NFL College Guessing Game</title>
  <meta name="description" content="Can you name the college every NFL player went to? Daily challenge plus Easy to Expert practice." />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="homeBtn" type="button" aria-label="Back to menu" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
      </button>
      <h1 class="wordmark"><span aria-hidden="true">🏈</span> College Guess</h1>
      <div class="topbar-right" id="topbarRight"></div>
    </header>

    <main id="screen" tabindex="-1">
      <p class="loading">Loading players…</p>
    </main>

    <footer class="footer" id="footer">
      Rosters updated <span id="dataDate">—</span>. Data: Sleeper, nflverse, Pro-Football-Reference.
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
